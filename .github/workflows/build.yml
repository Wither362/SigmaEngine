name: Build MicroPython Distribution

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out repository code into the runner workspace
      - name: Checkout repository
        uses: actions/checkout@v4

      # Copy root and subfolder files into dist/ while excluding unneeded items (cpython shit and more)
      - name: Stage build files
        run: |
          mkdir -p dist
          rsync -a \
            --exclude='.git/' \
            --exclude='__pycache__/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.typings/' \
            --exclude='.vscode/' \
            --exclude='dist/' \
            --exclude='docs/' \
            --exclude='docs.md' \
            --exclude='desktop/' \
            --exclude='README.md' \
            --exclude='gint.py' \
            . dist/

      # Delete # NON_MICROPYTHON # END code and unwrap 
      # Strip # NON_MICROPYTHON blocks and unwrap if (in_micropython) blocks
      - name: Clean Repository files for MicroPython use
        run: |
          find dist/ -type f -name "*.py" | while read -r file; do
            # Remove # NON_MICROPYTHON ... # END blocks
            sed -i '/^[[:space:]]*# NON_MICROPYTHON[[:space:]]*$/,/^[[:space:]]*# END[[:space:]]*$/d' "$file"

            # Remove if (in_micropython) lines and unindent their inner blocks
            awk '
              !in_block && /^[[:space:]]*if[[:space:]]*\(?[[:space:]]*in_micropython[[:space:]]*\)?[[:space:]]*:?[[:space:]]*(#.*)?$/ {
                match($0, /^[[:space:]]*/)
                base_indent = RLENGTH
                in_block = 1
                step = 0
                next
              }
              in_block {
                if ($0 ~ /^[[:space:]]*$/) {
                  print $0
                  next
                }
                match($0, /^[[:space:]]*/)
                cur_indent = RLENGTH
                if (cur_indent <= base_indent) {
                  in_block = 0
                } else {
                  if (step == 0) step = cur_indent - base_indent
                  print substr($0, step + 1)
                  next
                }
              }
              { print $0 }
            ' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
          done
      # Upload the cleaned dist/ folder as a build artifact
      - name: Package build output
        uses: actions/upload-artifact@v4
        with:
          name: micropython-build
          path: dist/